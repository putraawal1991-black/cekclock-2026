html_content = """<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aplikasi Web</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0f19;
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #00ffaa;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.5px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 10;
      transition: opacity 0.4s ease;
    }
    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid rgba(0, 255, 170, 0.15);
      border-radius: 50%;
      border-top-color: #00ffaa;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
    }
  </style>
</head>
<body>

  <div id="loading">
    <div class="spinner"></div>
    <span>Memuat aplikasi...</span>
  </div>

  <iframe 
    id="app-frame"
    src="https://script.google.com/macros/s/AKfycbyJpn7dE3vusyp4uV3o6khew_cCY0qVPeajgstB7TphnziioCVjZlnLxWvmb1IoHGi-/exec"
    allow="geolocation; microphone; camera; midi; vr; accelerometer; gyroscope; payment; ambient-light-sensor"
    sandbox="allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts"
    onload="document.getElementById('loading').style.display='none';">
  </iframe>

</body>
</html>
"""

filename = "index.html"
with open(filename, "w", encoding="utf-8") as f:
    f.write(html_content)

print(f"File {filename} created successfully.")
